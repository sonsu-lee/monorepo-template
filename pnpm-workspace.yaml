packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@next/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - next
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - react@19.2.8
  - react-dom@19.2.8
  - '@hono/node-server@2.0.12'
