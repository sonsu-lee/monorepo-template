name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nodeup toolchain
        uses: ./.github/actions/setup-nodeup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js types
        run: pnpm --filter @repo/web typegen

      - name: Check formatting
        run: pnpm exec turbo run format:check --force

      - name: Lint
        run: pnpm exec turbo run lint --force

      - name: Type-check
        run: pnpm exec turbo run typecheck --force

      - name: Run unit tests
        run: pnpm exec turbo run test --force

      - name: Build
        run: pnpm exec turbo run build --force

  e2e:
    name: End-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Nodeup toolchain
        uses: ./.github/actions/setup-nodeup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm exec turbo run test:e2e --force
