name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate project pnpm
        run: |
          corepack enable
          corepack install

      - name: Verify runtime versions
        run: |
          runtime_node_expected="$(tr -d '\n' < .node-version)"
          runtime_node_engine="$(node -p "require('./package.json').engines.node.slice(1)")"
          runtime_pnpm_expected="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          test "$(node --version)" = "v${runtime_node_expected}"
          test "${runtime_node_engine}" = "${runtime_node_expected}"
          test "$(pnpm --version)" = "${runtime_pnpm_expected}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js types
        run: pnpm --filter @repo/web exec next typegen

      - name: Check formatting
        run: pnpm exec turbo run format:check --force

      - name: Lint
        run: pnpm exec turbo run lint --force

      - name: Type-check
        run: pnpm exec turbo run typecheck --force

      - name: Run unit tests
        run: pnpm exec turbo run test --force

      - name: Build
        run: pnpm exec turbo run build --force

  e2e:
    name: End-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Activate project pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm exec turbo run test:e2e --force
